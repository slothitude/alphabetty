services:
  alphabetty:
    build: .
    ports:
      - "7700:7700"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
      - ./chrome-profile:/chrome-profile   # Persist Chrome profile (cookies, localStorage, extensions)
    environment:
      - ALPHABETTY_LLM_URL=${ALPHABETTY_LLM_URL:-https://api.z.ai/api/coding/paas/v4/chat/completions}
      - ALPHABETTY_LLM_MODEL=${ALPHABETTY_LLM_MODEL:-glm-5.1}
      - ALPHABETTY_LLM_API_KEY=${ALPHABETTY_LLM_API_KEY:-a63a2a7ee2d5431d929c776122e3b706.hzHjrJlnfPd7cYfj}
      - ALPHABETTY_SEARXNG_URL=${ALPHABETTY_SEARXNG_URL:-http://192.168.0.33:8888}
      - ALPHABETTY_OLLAMA_URL=${ALPHABETTY_OLLAMA_URL:-http://192.168.0.33:11434/v1/chat/completions}
      - ALPHABETTY_ROUTER_URL=${ALPHABETTY_ROUTER_URL:-http://192.168.0.33:4000}
      - ALPHABETTY_DB_PATH=/data/alphabetty.db
      - ALPHABETTY_SECRET_KEY=${ALPHABETTY_SECRET_KEY:-change-me-in-production}
      - ALPHABETTY_DEMO_ENABLED=${ALPHABETTY_DEMO_ENABLED:-true}
      - ALPHABETTY_MCP_SSE=${ALPHABETTY_MCP_SSE:-true}
      - ALPHABETTY_API_KEY=${ALPHABETTY_API_KEY:-}
      - ALPHABETTY_N8N_URL=${ALPHABETTY_N8N_URL:-http://n8n:5678}
      - ALPHABETTY_N8N_API_KEY=${ALPHABETTY_N8N_API_KEY:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_API_KEY=${ALPHABETTY_N8N_API_KEY:-change-me}
      - WEBHOOK_URL=http://n8n:5678/
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=last
      - N8N_METRICS=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 256M }
    restart: unless-stopped
