<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabetty — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --bg1: #0a0a0b;
            --bg2: #141416;
            --bg3: #1c1c1f;
            --t1: #e4e4e7;
            --t2: #a1a1aa;
            --t3: #71717a;
            --t4: #52525b;
            --border: #27272a;
            --accent: #3b82f6;
            --gold: #fbbf24;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg1);
            color: var(--t1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand img {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .login-brand h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--t1);
            margin-bottom: 4px;
        }
        .login-brand p {
            font-size: 13px;
            color: var(--t3);
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--t3);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--t1);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus {
            border-color: var(--accent);
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--t3);
        }
        .toggle-link a {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }
        .toggle-link a:hover {
            text-decoration: underline;
        }
        .demo-notice {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--t4);
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .demo-notice code {
            background: var(--bg3);
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--t3);
        }
    </style>
</head>
<body>
<div id="login-page">
    <div class="login-card">
        <div class="login-brand">
            <img src="/static/icon.svg" alt="Alphabetty">
            <h1 id="form-title">Sign In</h1>
            <p>The Search Engine of the Future</p>
        </div>

        <div class="error-box" id="login-error"></div>

        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="field" id="email-field" style="display:none">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" name="email" autocomplete="email">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
        </form>

        <div class="toggle-link">
            <a id="toggle-mode">Don't have an account? Register</a>
        </div>

        <div class="demo-notice" id="demo-notice">
            Demo account: <code>demo</code> / <code>demo</code>
        </div>
    </div>
</div>

<script src="/static/js/auth.js?v=2"></script>
<script>auth.init();</script>
</body>
</html>
